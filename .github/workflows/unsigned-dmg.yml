name: Unsigned macOS DMG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned DMG
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Build without signing
        run: |
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create DMG
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Notch.app"
          test -d "$APP"
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          chmod +x Configuration/dmg/create_dmg.sh
          ./Configuration/dmg/create_dmg.sh "$APP" "$RUNNER_TEMP/The-Notch-unsigned.dmg" "The Notch"
          cp "$RUNNER_TEMP/The-Notch-unsigned.dmg" The-Notch-unsigned.dmg
          shasum -a 256 The-Notch-unsigned.dmg | tee The-Notch-unsigned.dmg.sha256

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: The-Notch-unsigned-dmg
          path: |
            The-Notch-unsigned.dmg
            The-Notch-unsigned.dmg.sha256
