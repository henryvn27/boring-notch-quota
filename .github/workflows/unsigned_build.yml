name: Unsigned macOS build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Boring Notch app
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Build without signing
        run: |
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Notch.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" boringNotch-unsigned.zip
          shasum -a 256 boringNotch-unsigned.zip | tee boringNotch-unsigned.zip.sha256

      - name: Upload unsigned app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringNotch-unsigned
          path: |
            boringNotch-unsigned.zip
            boringNotch-unsigned.zip.sha256
